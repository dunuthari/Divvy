<meta charset="utf-8">
<title>Divvy Test App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Divvy test build. Tokens and components follow design.md. The page is the app: one phone-sized column,
   centred in a frame on wide screens and full-bleed on a phone. */
:root{
  --bg:#F3EEFE; --bg-top:#DED2FF; --surface:#FFFFFF; --surface-2:#F8F5FF; --ink:#14111C; --ink-2:#3A3347; --muted:#756C8B; --line:#E3DBF3;
  --lilac:#C3B0FF; --peach:#FFC98A; --sky:#A9D0FF; --bubble:#FFB8E3; --mint:#B8EBD0;
  --owed:#0E7A52; --owed-soft:#CBF2E0; --owe:#CC3B27; --owe-soft:#FFDFD8; --wait:#8A5A00; --wait-soft:#FFE8BE;
  --btn-bg:#14111C; --btn-fg:#FFFFFF; --nav-bg:#0D1019; --glass:rgba(255,255,255,.62); --overlay:rgba(14,8,28,.48);
  --ink-card:#17131F;
  --shadow:0 1px 2px rgba(60,40,110,.06),0 10px 28px rgba(60,40,110,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-ui:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110E1A; --bg-top:#2B2150; --surface:#1B1727; --surface-2:#241F33; --ink:#F5F1FF; --ink-2:#D5CDEB; --muted:#A399BE; --line:#312A45;
    --lilac:#5B46B8; --peach:#9A6420; --sky:#2F5F9E; --bubble:#9C3F80; --mint:#1F6E4E;
    --owed:#6FE3AE; --owed-soft:#154433; --owe:#FF9A86; --owe-soft:#47231D; --wait:#FFCB6B; --wait-soft:#473515;
    --btn-bg:#F5F1FF; --btn-fg:#110E1A; --nav-bg:#2D2545; --glass:rgba(255,255,255,.14); --overlay:rgba(0,0,0,.66); --ink-card:#0A0810;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110E1A; --bg-top:#2B2150; --surface:#1B1727; --surface-2:#241F33; --ink:#F5F1FF; --ink-2:#D5CDEB; --muted:#A399BE; --line:#312A45;
  --lilac:#5B46B8; --peach:#9A6420; --sky:#2F5F9E; --bubble:#9C3F80; --mint:#1F6E4E;
  --owed:#6FE3AE; --owed-soft:#154433; --owe:#FF9A86; --owe-soft:#47231D; --wait:#FFCB6B; --wait-soft:#473515;
  --btn-bg:#F5F1FF; --btn-fg:#110E1A; --nav-bg:#2D2545; --glass:rgba(255,255,255,.14); --overlay:rgba(0,0,0,.66); --ink-card:#0A0810;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:14px}
.phone{position:relative;width:min(100%,410px);height:min(100%,880px);background:var(--bg);border:1px solid var(--line);border-radius:40px;box-shadow:var(--shadow);overflow:hidden}
@media (max-width:520px){.stage{padding:0}.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}
#view{height:100%;display:flex;flex-direction:column}
.grad{background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 46%)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 110px}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;min-height:60px}
.topbar h1{flex:1;margin:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circle{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);flex:none;color:var(--ink)}
.circle.ink{background:var(--btn-bg);color:var(--btn-fg);box-shadow:none}
.textbtn{font-weight:700;color:var(--muted);padding:10px 8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:999px;font-weight:700;background:var(--btn-bg);color:var(--btn-fg);white-space:nowrap}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 18px;font-size:15px}
.btn.xs{min-height:36px;padding:0 14px;font-size:14px}
.btn.soft{background:var(--lilac);color:var(--ink)}
.btn.pink{background:var(--bubble);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.glass{background:var(--glass);color:var(--ink)}
.btn.warn{background:var(--owe-soft);color:var(--owe)}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.pill.owed{background:var(--owed-soft);color:var(--owed);box-shadow:none}
.pill.owe{background:var(--owe-soft);color:var(--owe);box-shadow:none}
.pill.wait{background:var(--wait-soft);color:var(--wait);box-shadow:none}
.pill.ink{background:var(--btn-bg);color:var(--btn-fg);box-shadow:none}
.pill.glass{background:var(--glass);color:var(--ink);box-shadow:none}

.pav{--sz:44px;width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;flex:none;display:block;position:relative;background:var(--lilac)}
.pav img{position:absolute;left:50%;bottom:-4%;width:118%;height:auto;transform:translateX(-50%)}
.pav.c2{background:var(--peach)}.pav.c3{background:var(--sky)}.pav.c4{background:var(--bubble)}.pav.c5{background:var(--mint)}
.pav.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.stack{display:flex}.stack .pav{box-shadow:0 0 0 2.5px var(--surface)}.stack .pav+.pav{margin-left:-9px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bubble)}
.money{font-family:var(--f-display);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.label{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.bubble{position:relative;background:var(--surface);color:var(--ink);border-radius:22px;padding:12px 16px;font-weight:600;font-size:15px;line-height:1.3;box-shadow:var(--shadow)}
.bubble::after{content:"";position:absolute;width:16px;height:16px;background:inherit;transform:rotate(45deg);border-radius:4px;left:34px;bottom:-6px}
.pigimg{display:block;filter:drop-shadow(0 12px 14px rgba(40,20,90,.28))}
.bento{border-radius:28px;padding:16px;position:relative;overflow:hidden;color:var(--ink)}
.bento.lilac{background:var(--lilac)}.bento.peach{background:var(--peach)}.bento.sky{background:var(--sky)}.bento.bubble{background:var(--bubble)}.bento.mint{background:var(--mint)}
.bento.ink{background:var(--ink-card);color:#fff}
.bento.surface{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tabs{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{flex:1;text-align:center;font-weight:700;font-size:14px;padding:10px 0;border-radius:999px;color:var(--muted)}
.tabs button.on{background:var(--btn-bg);color:var(--btn-fg)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--owed)}.neg{color:var(--owe)}
.ico{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--peach);color:var(--ink);flex:none}
.exp{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 0}
.bar{position:relative;height:10px;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px}
.bar i.p{left:50%;background:var(--owed)}.bar i.n{right:50%;background:var(--owe)}
.field{display:grid;gap:6px;margin-top:14px}
.field>span{font-size:13px;color:var(--muted);font-weight:700}
.input{width:100%;min-height:54px;background:var(--surface);border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:18px;padding:0 16px;outline:none;font-weight:600}
.input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.amountbox{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:22px;padding:4px 18px}
.amountbox:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.amountbox span{font-family:var(--f-display);font-size:24px;color:var(--muted);font-weight:700}
.amountbox input{border:0;background:none;outline:none;width:100%;min-height:62px;font-family:var(--f-display);font-size:40px;font-weight:800;letter-spacing:-.03em}
.sel{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:7px 0;min-height:52px}
.chk{flex:none;width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent;background:var(--surface)}
.chk .i{width:14px;height:14px;stroke-width:3}
[aria-checked="true"] .chk{background:var(--btn-bg);color:var(--btn-fg);box-shadow:none}
.mini{width:112px;min-height:42px;text-align:right;padding:0 12px;border-radius:12px;background:var(--surface-2);border:0;box-shadow:inset 0 0 0 1px var(--line);outline:none;font-weight:700}
.mini:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;text-align:center;min-height:40px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--btn-bg);color:var(--btn-fg)}
.status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;border-radius:14px;padding:9px 14px;margin-top:8px}
.status .i{width:16px;height:16px}
.status.ok{background:var(--owed-soft);color:var(--owed)}.status.bad{background:var(--owe-soft);color:var(--owe)}.status.info{background:var(--wait-soft);color:var(--wait)}
.card{background:var(--surface);border-radius:24px;padding:6px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:20px;margin-bottom:8px}
.bottombar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 18px;background:linear-gradient(to top,var(--bg) 68%,transparent)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin:8px 0 4px;font-family:var(--f-display)}
.tl .it{display:flex;gap:12px;padding:10px 0}
.mrow{display:flex;align-items:center;gap:8px;min-height:60px;border-bottom:1px solid var(--line)}
.mrow:last-of-type{border-bottom:0}
.mrow.head{min-height:34px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mrow.off .grow,.mrow.off .pav{opacity:.45}
.mcol{width:78px;flex:none;text-align:right}
.mrow .mini{width:78px}
.chkbtn{display:grid;place-items:center;width:30px;height:44px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:4px 6px 4px 14px;font-weight:700}
.chip button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip .i{width:14px;height:14px}
.banner{margin:6px 20px 0;display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 14px;background:var(--wait-soft);color:var(--wait);font-weight:700;font-size:13.5px}
.banner button{margin-left:auto;font-weight:800;text-decoration:underline}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--owed)}
.live.local::before{background:var(--wait)}

.welcome{flex:1;display:flex;flex-direction:column;padding:30px 24px 26px;gap:14px;overflow-y:auto}
.welcome h2{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1.02;letter-spacing:-.035em;margin:10px 0 0}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em}
.hero{border-radius:28px;padding:18px;position:relative;overflow:hidden;background:var(--lilac);color:var(--ink);min-height:190px}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.picker button{position:relative;display:grid;place-items:center}
.picker .tick{position:absolute;right:4px;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.picker .tick .i{width:13px;height:13px;stroke-width:3}

.sheet-wrap{position:absolute;inset:0;background:var(--overlay);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 20px 24px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em;margin:0 0 4px}
.linkbox{display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:6px 6px 6px 14px}
.linkbox code{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);display:flex;align-items:center;gap:12px;background:var(--btn-bg);color:var(--btn-fg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:800;text-decoration:underline}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.sp{flex:1}
.urlbar{display:flex;align-items:center;gap:8px;margin:6px 16px 0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.splash{flex:1;display:grid;place-items:center}
</style>

<div class="stage"><div class="phone" id="phone"><div id="view"></div><div id="sheetRoot"></div><div id="toast" role="status" aria-live="polite"></div></div></div>

function rs(n){ return 'Rs ' + Math.round(n).toLocaleString('en-US'); }
function splitEqual(total, ids, payers){
  var n = ids.length, base = Math.floor(total / n), rem = total - base * n, sh = {};
  ids.forEach(function(i){ sh[i] = base; });
  if (rem){ var top = ids[0], best = -1; ids.forEach(function(i){ var p = (payers && payers[i]) || 0; if (p > best){ best = p; top = i; } }); sh[top] += rem; }
  return sh;
}
function splitPercent(total, pct, ids){
  var sh = {}, used = 0, big = ids[0];
  ids.forEach(function(i){ var p = parseFloat(pct[i]) || 0; sh[i] = Math.floor(total * p / 100); used += sh[i]; if (p > (parseFloat(pct[big]) || 0)) big = i; });
  sh[big] += total - used;
  return sh;
}
function validateDraft(d, memberIds){
  var total = parseInt(d.amount) || 0;
  var payers = {}, paid = 0;
  var payIds = memberIds.filter(function(m){ var v = parseInt(d.payAmt[m]) || 0; if (v > 0){ payers[m] = v; paid += v; return true; } return false; });
  var payLeft = total - paid, payOk = total > 0 && payIds.length > 0 && payLeft === 0;
  var ids = memberIds.filter(function(m){ return d.shared[m]; });
  var shares = null, splitLeft = 0, splitOk = false;
  if (ids.length && total > 0){
    if (d.mode === 'equal'){ shares = splitEqual(total, ids, payers); splitOk = true; }
    else if (d.mode === 'pct'){
      var s = 0; ids.forEach(function(m){ s += parseFloat(d.pct[m]) || 0; });
      var h = Math.round(s * 100); splitLeft = (10000 - h) / 100; splitOk = h === 10000;
      if (splitOk) shares = splitPercent(total, d.pct, ids);
    } else {
      var s2 = 0; ids.forEach(function(m){ s2 += parseInt(d.exact[m]) || 0; });
      splitLeft = total - s2; splitOk = splitLeft === 0;
      if (splitOk){ shares = {}; ids.forEach(function(m){ shares[m] = parseInt(d.exact[m]) || 0; }); }
    }
  }
  var titleOk = d.title.trim().length > 0, hint = '';
  if (!titleOk) hint = 'Add a title';
  else if (total <= 0) hint = 'Enter the total amount';
  else if (!payIds.length) hint = 'Pick who paid';
  else if (!payOk) hint = 'Paid amounts must add up to ' + rs(total);
  else if (!ids.length) hint = 'Pick at least one person who shared it';
  else if (!splitOk) hint = d.mode === 'pct' ? 'Percentages must add up to 100%' : 'Amounts must add up to ' + rs(total);
  else if (total > 100000000) hint = 'That amount is too large';
  return {total:total, payIds:payIds, payers:payers, payLeft:payLeft, payOk:payOk, ids:ids, shares:shares, splitLeft:splitLeft, splitOk:splitOk, hint:hint, ok:!hint};
}
function balancesOf(memberIds, expenses, payments){
  var b = {}; memberIds.forEach(function(m){ b[m] = 0; });
  expenses.forEach(function(e){
    if (e.deleted) return;
    for (var m in e.payers) b[m] = (b[m] || 0) + e.payers[m];
    for (var k in e.shares) b[k] = (b[k] || 0) - e.shares[k];
  });
  payments.forEach(function(p){ if (p.status === 'confirmed'){ b[p.from] = (b[p.from] || 0) + p.amount; b[p.to] = (b[p.to] || 0) - p.amount; } });
  return b;
}
function suggest(b){
  var cr = [], db = [];
  for (var m in b){ if (b[m] > 0) cr.push([m, b[m]]); else if (b[m] < 0) db.push([m, -b[m]]); }
  cr.sort(function(a, c){ return c[1] - a[1]; }); db.sort(function(a, c){ return c[1] - a[1]; });
  var out = [], i = 0, j = 0;
  while (i < cr.length && j < db.length){
    var x = Math.min(cr[i][1], db[j][1]);
    out.push({from:db[j][0], to:cr[i][0], amount:x});
    cr[i][1] -= x; db[j][1] -= x;
    if (!cr[i][1]) i++; if (!db[j][1]) j++;

  return out;
}

function makeLocalDb(){
  var KEY = 'divvy-local-db-v1', store = {}, subs = [];
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
  function rid(){ return 'd' + Math.random().toString(36).slice(2, 10); }
  function clone(x){ return JSON.parse(JSON.stringify(x)); }
  function merge(a, b){ var o = clone(a); for (var k in b){ if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && o[k] && typeof o[k] === 'object') o[k] = merge(o[k], b[k]); else o[k] = clone(b[k]); } return o; }
  function mkDoc(k){ return {id:k.slice(k.lastIndexOf('/') + 1), exists:true, data:function(){ return clone(store[k]); }}; }
  function snapshot(cp){
    var docs = Object.keys(store).filter(function(k){ return k.slice(0, k.lastIndexOf('/')) === cp; }).sort().map(mkDoc);
    return {docs:docs, size:docs.length, empty:!docs.length};
  }
  function notify(cp){ subs.filter(function(s){ return s.path === cp; }).forEach(function(s){ s.cb(snapshot(cp)); }); }
  function docRef(path){
    var ci = path.lastIndexOf('/'), cp = path.slice(0, ci);
    return {
      id:path.slice(ci + 1), path:path,
      get:function(){ return Promise.resolve(store[path] ? mkDoc(path) : {id:path.slice(ci + 1), exists:false, data:function(){ return undefined; }}); },
      set:function(d){ store[path] = clone(d); save(); notify(cp); return Promise.resolve(); },
      update:function(d){ if (!store[path]) return Promise.reject({code:'invalid_argument', message:'missing'}); store[path] = merge(store[path], d); save(); notify(cp); return Promise.resolve(); },
      delete:function(){ delete store[path]; save(); notify(cp); return Promise.resolve(); },
      onSnapshot:function(next){ var f = function(){ next(store[path] ? mkDoc(path) : {id:path.slice(ci + 1), exists:false, data:function(){ return undefined; }}); }; var s = {path:cp, cb:f}; subs.push(s); setTimeout(f, 0); return function(){ var i = subs.indexOf(s); if (i >= 0) subs.splice(i, 1); }; },
      collection:function(n){ return colRef(path + '/' + n); }
    };
  }
  function colRef(path){
    return {
      path:path,
      doc:function(id){ return docRef(path + '/' + (id || rid())); },
      add:function(d){ var r = this.doc(); return r.set(d).then(function(){ return r; }); },
      get:function(){ return Promise.resolve(snapshot(path)); },
      onSnapshot:function(next){ var s = {path:path, cb:next}; subs.push(s); setTimeout(function(){ next(snapshot(path)); }, 0); return function(){ var i = subs.indexOf(s); if (i >= 0) subs.splice(i, 1); }; }
    };
  }
  return {collection:colRef, doc:docRef};
}

function isOwner(gid){ var g = S.groups[gid]; return !!g && g.ownerPid && g.ownerPid === myPid(gid); }
function liveExpenses(gid){ var e = S.expenses[gid] || {}; return Object.keys(e).map(function(id){ var x = Object.assign({}, e[id]); x.id = id; return x; }).filter(function(x){ return !x.deleted; }).sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); }); }
function paymentsOf(gid){ var p = S.payments[gid] || {}; return Object.keys(p).map(function(id){ var x = Object.assign({}, p[id]); x.id = id; return x; }).sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); }); }
function balOf(gid){ return balancesOf(activePeopleAll(gid), liveExpenses(gid), paymentsOf(gid)); }
function activePeopleAll(gid){ return Object.keys(S.people[gid] || {}); }
function pigOf(gid, id){ var p = (S.people[gid] || {})[id]; return p && p.pig ? p.pig : 1; }
function colorClass(id){ var h = 0; String(id).split('').forEach(function(c){ h = (h * 31 + c.charCodeAt(0)) % 5; }); return 'c' + (h + 1); }
function av(gid, id, sz, extra){ return '<span class="pav ' + colorClass(id) + (extra ? ' ' + extra : '') + '" style="--sz:' + sz + 'px" aria-hidden="true"><img src="' + PIGS['head' + pigOf(gid, id)] + '" alt=""></span>'; }
function avp(pig, sz, cls, on){ return '<span class="pav ' + (cls || '') + (on ? ' on' : '') + '" style="--sz:' + sz + 'px"><img src="' + PIGS['head' + pig] + '" alt=""></span>'; }
function netOf(gid){ var pid = myPid(gid); if (!pid) return 0; return balOf(gid)[pid] || 0; }
function statusPill(v){ return v > 0 ? '<span class="pill owed num">You’re owed ' + rs(v) + '</span>' : v < 0 ? '<span class="pill owe num">You owe ' + rs(-v) + '</span>' : '<span class="pill">All settled</span>'; }
function tilePill(v){ return '<span class="pill glass num">' + (v > 0 ? 'You\u2019re owed ' + rs(v) : v < 0 ? 'You owe ' + rs(-v) : 'All settled') + '</span>'; }
function signed(v){ return (v > 0 ? '+' : v < 0 ? '−' : '') + rs(Math.abs(v)); }
function log(gid, text){ return gcol(gid, 'activity').add({who:myPid(gid), text:text, ts:Date.now()}); }
function needWrite(){ if (CAN_WRITE) return true; toast('You have view-only access to this test.'); return false; }

/* ---------- toast ---------- */
var tt;
function toast(msg, label, fn){
  var t = $('#toast'); t.innerHTML = '<span>' + esc(msg) + '</span>' + (label ? '<button id="toastBtn">' + esc(label) + '</button>' : '');
  if (label){ var b = $('#toastBtn'); b.onclick = function(){ t.classList.remove('on'); fn(); }; }
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, label ? 6000 : 2600);
}

/* ---------- screens ---------- */
function liveTag(){ return '<span class="live ' + (MODE === 'live' ? '' : 'local') + '">' + (MODE === 'live' ? 'Live, shared' : 'Local only') + '</span>'; }

function welcomeScreen(){
  return '<div class="welcome grad"><div class="logo"><span style="display:flex;width:34px"><svg viewBox="0 0 40 40"><path d="M19 4a16 16 0 000 32z" fill="var(--btn-bg)"/><path d="M22 4a16 16 0 010 32z" fill="var(--btn-bg)" opacity=".35"/></svg></span>Divvy</div>' +
    '<div style="position:relative;height:330px;display:flex;justify-content:center;align-items:flex-end;margin-top:8px"><div style="position:absolute;bottom:0;width:290px;height:290px;border-radius:50%;background:var(--lilac)"></div>' +
    '<div class="bubble" style="position:absolute;left:0;top:0;max-width:200px;transform:rotate(-3deg)">Oink! Who got lunch today?</div>' +
    '<img class="pigimg" src="' + PIGS.bust1 + '" alt="Divvy the pig" style="position:relative;height:310px"></div>' +
    '<h2>Split bills, keep the peace.</h2><p class="muted" style="margin:0">Add who paid. Divvy shows who owes who, live, for everyone in the group.</p><div class="sp"></div>' +
    '<button class="btn block" data-a="start">Start testing</button><p class="small muted" style="text-align:center;margin:0">Test build. Google sign-in arrives in the real app.</p></div>';
}

function firstRunScreen(){
  var f = S.fr;
  return '<div class="topbar"><span style="width:46px"></span><h1>Your pig</h1><span style="width:46px"></span></div><div class="scroll grad" style="background:none">' +
    '<label class="field" style="margin-top:6px"><span>Your name</span><input class="input" id="frName" data-in="frname" value="' + esc(f.name) + '" placeholder="What do friends call you?" autocomplete="off" maxlength="30"></label>' +
    '<div class="label" style="margin:20px 0 10px">Pick your pig</div>' +
    '<div style="position:relative;height:250px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;border-radius:30px;background:var(--lilac)"><img class="pigimg" id="frPreview" src="' + PIGS['bust' + f.pig] + '" alt="Selected pig" style="height:260px;margin-bottom:-44px"></div>' +
    '<div class="picker" style="margin-top:18px" id="frPicker">' + pickerHTML(f.pig) + '</div></div>' +
    '<div class="bottombar"><button class="btn block" id="frGo" data-a="frDone" ' + (f.name.trim() ? '' : 'disabled') + '>Continue</button></div>';
}
function pickerHTML(sel){
  var h = ''; for (var n = 1; n <= 10; n++) h += '<button data-a="pickPig" data-n="' + n + '" aria-label="Pig ' + n + '">' + avp(n, 56, 'c' + ((n - 1) % 5 + 1), n === sel) + (n === sel ? '<span class="tick">' + ic('check') + '</span>' : '') + '</button>';
  return h;
}

function groupsScreen(){
  var gids = Object.keys(S.groups).sort(function(a, b){ return (S.groups[b].ts || 0) - (S.groups[a].ts || 0); });
  var owed = 0, owe = 0;
  gids.forEach(function(g){ var v = netOf(g); if (v > 0) owed += v; else owe -= v; });
  var me = S.profile || {name:'You', pig:1};
  var h = '<div class="topbar" style="padding-top:18px"><div class="logo" style="font-size:22px"><span style="display:flex;width:28px"><svg viewBox="0 0 40 40"><path d="M19 4a16 16 0 000 32z" fill="var(--btn-bg)"/><path d="M22 4a16 16 0 010 32z" fill="var(--btn-bg)" opacity=".35"/></svg></span>Divvy</div><div class="grow" style="text-align:center">' + liveTag() + '</div>' +
    '<button class="circle" data-a="profile" aria-label="Profile and settings">' + avp(me.pig, 40, 'c1') + '</button></div><div class="scroll">';
  h += '<div class="hero" style="min-height:0;padding:18px 20px"><div class="row"><div class="grow"><div class="eyebrow" style="color:var(--ink);opacity:.7">You’re owed</div><div class="money num" style="font-size:34px;margin-top:6px">' + rs(owed) + '</div></div>' +
    '<div class="grow"><div class="eyebrow" style="color:var(--ink);opacity:.7">You owe</div><div class="money num" style="font-size:34px;margin-top:6px">' + rs(owe) + '</div></div></div></div>';
  h += '<div class="row" style="margin:22px 0 12px"><span class="label grow">Test groups</span></div>';
  if (!gids.length){
    h += '<div class="bento lilac" style="padding:20px 18px 0;min-height:240px"><div class="label" style="font-size:22px">No groups yet</div><p style="margin:6px 0 14px;max-width:210px">Load the lunch example from our planning chat, or start your own.</p><button class="btn sm" data-a="seed">Load lunch example</button>' +
      '<img class="pigimg" src="' + PIGS.bust9 + '" alt="Pig with open arms" style="position:absolute;right:-16px;bottom:-60px;height:200px"></div>';
  } else {
    h += '<div class="stack" style="display:grid;gap:12px">' + gids.map(function(gid){
      var g = S.groups[gid], ppl = activePeople(gid), gi = GICONS[g.icon || 0] || GICONS[0], mine = myPid(gid), live = liveExpenses(gid).length;
      return '<button class="bento ' + gi[1] + '" style="text-align:left;display:block;width:100%" data-a="openGroup" data-id="' + gid + '"><div class="row"><span class="ico" style="background:var(--glass)">' + ic(gi[0]) + '</span>' +
        '<div class="grow"><div style="font-weight:800;font-size:18px" class="ell">' + esc(g.name) + '</div><div class="small" style="opacity:.8">' + ppl.length + ' people · ' + live + ' expenses</div></div>' +
        '<div class="stack">' + ppl.slice(0, 3).map(function(p){ return av(gid, p, 28); }).join('') + '</div></div>' +
        '<div style="margin-top:12px">' + (mine ? tilePill(netOf(gid)) : '<span class="pill ink">Join this group</span>') + '</div></button>';
    }).join('') + '</div>';
  }
  h += '</div><div class="bottombar"><button class="btn block" data-a="newgroup">' + ic('plus') + 'New group</button></div>';
  return h;
}

function newGroupScreen(){
  var n = S.ng;
  return '<div class="topbar"><button class="circle" data-a="back" aria-label="Back">' + ic('back') + '</button><h1>New group</h1><span style="width:46px"></span></div><div class="scroll">' +
    '<label class="field"><span>Group name</span><input class="input" id="ngName" data-in="ngname" value="' + esc(n.name) + '" placeholder="Lunch out, Ella trip, Flat bills" maxlength="40" autocomplete="off"></label>' +
    '<div class="label" style="margin:20px 0 8px">Icon</div><div class="row" style="gap:8px" id="ngIcons">' + ngIcons() + '</div>' +
    '<div class="label" style="margin:22px 0 4px">Who’s in?</div><div class="muted small" style="margin-bottom:8px">Add people by name. They don’t need the app yet, they can claim their name later.</div>' +
    '<div class="row"><input class="input grow" id="ngPerson" data-in="ngperson" placeholder="Add a name" maxlength="30" autocomplete="off"><button class="btn sm" data-a="ngAdd">Add</button></div>' +
    '<div class="chips" id="ngChips">' + ngChips() + '</div></div>' +
    '<div class="bottombar"><button class="btn block" id="ngCreate" data-a="ngCreate" ' + (n.name.trim() ? '' : 'disabled') + '>Create group</button></div>';
}
function ngIcons(){ return GICONS.map(function(g, i){ return '<button class="circle ' + (S.ng.icon === i ? 'ink' : '') + '" data-a="ngIcon" data-i="' + i + '" aria-label="Icon ' + g[0] + '">' + ic(g[0]) + '</button>'; }).join(''); }
function ngChips(){ return '<span class="chip" style="padding-right:14px">' + avp(S.profile.pig, 26, 'c1') + 'You</span>' + S.ng.people.map(function(p, i){ return '<span class="chip">' + esc(p) + '<button data-a="ngRemove" data-i="' + i + '" aria-label="Remove ' + esc(p) + '">' + ic('x') + '</button></span>'; }).join(''); }

function whoScreen(){
  var g = S.groups[S.gid], ppl = S.people[S.gid] || {};
  var free = Object.keys(ppl).filter(function(id){ return !ppl[id].uid && !ppl[id].removed; });
  return '<div class="topbar"><button class="circle" data-a="back" aria-label="Back">' + ic('back') + '</button><h1>Join ' + esc(g.name) + '</h1><span style="width:46px"></span></div><div class="scroll">' +
    '<div class="bento sky" style="margin-top:8px;padding:16px 18px 0;min-height:190px"><div class="bubble" style="max-width:220px">Who are you in this group?</div><img class="pigimg" src="' + PIGS.bust10 + '" alt="Waiting pig" style="position:absolute;right:-6px;bottom:-60px;height:170px"></div>' +
    '<div class="label" style="margin:20px 0 6px">Claim your name</div><div class="card" style="padding:4px 16px">' +
    (free.length ? free.map(function(id){ return '<button class="sel" data-a="claim" data-id="' + id + '">' + av(S.gid, id, 40) + '<b class="grow">' + esc(ppl[id].name) + '</b><span class="pill">That’s me</span></button>'; }).join('') : '<div class="empty" style="padding:16px">All names are claimed.</div>') + '</div>' +
    '<button class="btn block ghost" style="margin-top:14px" data-a="claimNew">I’m someone new</button></div>';
}

function groupScreen(){
  var gid = S.gid, g = S.groups[gid]; if (!g) return '<div class="splash"><div class="empty"><b>Group not found</b><button class="btn sm" data-a="back">Back to home</button></div></div>';
  var me = myPid(gid); if (!me) return whoScreen();
  var live = liveExpenses(gid), total = live.reduce(function(a, e){ return a + e.amount; }, 0);
  var mineShare = live.reduce(function(a, e){ return a + (e.shares[me] || 0); }, 0);
  var bal = balOf(gid), sug = suggest(bal), pend = paymentsOf(gid).filter(function(p){ return p.status === 'pending'; });
  var ppl = activePeople(gid);
  var h = '';
  var overriding = S.actAs[gid] && S.actAs[gid] !== realPid(gid);
  h += '<div class="row" style="padding:0 20px;justify-content:center"><button class="pill ' + (overriding ? 'wait' : '') + '" data-a="actasSheet" aria-label="Switch who you are testing as">' + (overriding ? 'Testing as ' + esc(S.people[gid][me].name) : 'You are ' + esc(S.people[gid][me].name)) + ' \u00b7 switch person</button></div>';
  h = '<div class="topbar"><button class="circle" data-a="back" aria-label="Back to groups">' + ic('back') + '</button><div class="grow" style="text-align:center"><div style="font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.03em" class="ell">' + esc(g.name) + '</div><div class="stack" style="justify-content:center;margin-top:4px">' + ppl.slice(0, 5).map(function(p){ return av(gid, p, 22); }).join('') + '</div></div>' +
    '<button class="circle" data-a="share" aria-label="Share">' + ic('share') + '</button></div>' + h + '<div class="scroll">';
  var owedToMe = sug.filter(function(s){ return s.to === me; }).sort(function(a, b){ return b.amount - a.amount; })[0];
  var iOwe = sug.filter(function(s){ return s.from === me; }).sort(function(a, b){ return b.amount - a.amount; })[0];
  if (owedToMe){
    var more = sug.filter(function(s){ return s.to === me; }).length - 1;
    h += '<div class="bento ink" style="margin-top:8px;min-height:190px"><div class="eyebrow" style="color:#fff;opacity:.7">' + esc(pname(gid, owedToMe.from)) + ' owes you</div><div class="money num" style="font-size:50px;margin-top:8px;color:#fff">' + rs(owedToMe.amount) + '</div>' +
      (more > 0 ? '<div class="small" style="opacity:.7;margin-top:6px">+' + more + ' more in Balances</div>' : '') +
      '<div class="row" style="position:absolute;left:16px;bottom:16px"><button class="btn xs pink" data-a="nudge" data-from="' + owedToMe.from + '" data-to="' + me + '">Nudge ' + esc(pname(gid, owedToMe.from)) + '</button></div>' +
      '<img class="pigimg" src="' + PIGS.bust4 + '" alt="Pig pointing" style="position:absolute;right:-4px;bottom:-54px;height:176px"></div>';
  } else if (iOwe){
    h += '<div class="bento ink" style="margin-top:8px;min-height:190px"><div class="eyebrow" style="color:#fff;opacity:.7">You owe ' + esc(pname(gid, iOwe.to)) + '</div><div class="money num" style="font-size:50px;margin-top:8px;color:#fff">' + rs(iOwe.amount) + '</div>' +
      '<div class="row" style="position:absolute;left:16px;bottom:16px"><button class="btn xs pink" data-a="record" data-from="' + me + '" data-to="' + iOwe.to + '" data-amt="' + iOwe.amount + '">I paid ' + esc(pname(gid, iOwe.to)) + '</button></div>' +
      '<img class="pigimg" src="' + PIGS.bust5 + '" alt="Pig with hand on hip" style="position:absolute;right:-4px;bottom:-54px;height:176px"></div>';
  } else {
    h += '<div class="bento mint" style="margin-top:8px;min-height:170px"><div class="eyebrow" style="color:var(--ink);opacity:.7">Balance</div><div class="money" style="font-size:40px;margin-top:8px">' + (live.length ? 'All settled' : 'Nothing yet') + '</div>' +
      '<div class="small" style="margin-top:6px;max-width:170px;opacity:.85">' + (live.length ? 'Nobody owes anything.' : 'Add the first expense.') + '</div><img class="pigimg" src="' + PIGS.bust6 + '" alt="Pig with basketball" style="position:absolute;right:-4px;bottom:-50px;height:170px"></div>';
  }
  h += '<div class="row" style="margin-top:12px;gap:12px"><div class="bento mint grow" style="padding:14px 16px;border-radius:24px"><div class="eyebrow" style="color:var(--ink);opacity:.7">Total spent</div><div class="money num" style="font-size:24px;margin-top:6px">' + rs(total) + '</div></div>' +
    '<div class="bento sky grow" style="padding:14px 16px;border-radius:24px"><div class="eyebrow" style="color:var(--ink);opacity:.7">Your share</div><div class="money num" style="font-size:24px;margin-top:6px">' + rs(mineShare) + '</div></div></div>';
  h += '<div class="tabs" style="margin-top:16px">' + ['expenses','balances','activity'].map(function(t){ return '<button class="' + (S.tab === t ? 'on' : '') + '" data-a="tab" data-t="' + t + '">' + t[0].toUpperCase() + t.slice(1) + (t === 'balances' && pend.length ? ' •' : '') + '</button>'; }).join('') + '</div>';
  h += S.tab === 'expenses' ? expensesTab(gid, live, me) : S.tab === 'balances' ? balancesTab(gid, bal, sug, pend, me) : activityTab(gid);
  h += '</div><div class="bottombar"><button class="btn block" data-a="add">' + ic('plus') + 'Add expense</button></div>';
  return h;
}

function payersLabel(gid, e){ var ids = Object.keys(e.payers); return pname(gid, ids[0]) + (ids.length > 1 ? ' +' + (ids.length - 1) : ''); }
function expensesTab(gid, live, me){
  if (!live.length) return '<div class="empty"><img class="pigimg" src="' + PIGS.bust9 + '" alt="" style="height:130px;margin:0 auto"><b>No expenses yet</b>Add the first one. Everyone in the group sees it straight away.</div>';
  return '<div style="margin-top:6px">' + live.map(function(e){
    var s = e.shares[me];
    return '<button class="exp" data-a="exp" data-id="' + e.id + '"><span class="ico">' + ic('fork') + '</span><div class="grow"><div style="font-weight:700" class="ell">' + esc(e.title) + '</div><div class="muted small ell">Paid by ' + esc(payersLabel(gid, e)) + ' · ' + esc(e.date || fmtDay(e.ts)) + '</div></div>' +
      '<div style="text-align:right"><div class="num" style="font-weight:700">' + rs(e.amount) + '</div><div class="small num ' + (s === undefined ? 'pos' : 'muted') + '">' + (s === undefined ? 'Not in split' : 'Your share ' + rs(s)) + '</div></div></button>';
  }).join('') + '</div>';
}

function balancesTab(gid, bal, sug, pend, me){
  var ppl = activePeople(gid), max = Math.max(1, Math.max.apply(null, ppl.map(function(m){ return Math.abs(bal[m] || 0); })));
  var owner = isOwner(gid), P = S.people[gid], h = '';
  if (!sug.length && !pend.length) h += '<div class="status ok" style="margin-top:14px;padding:14px 16px;font-size:15px">' + ic('check') + 'All settled. Nobody owes anything.</div>';
  if (pend.length){
    h += '<div class="label" style="margin:18px 0 8px">Waiting for confirmation</div><div style="display:grid;gap:12px">' + pend.map(function(p){
      var canConfirm = p.to === me || (owner && P[p.to] && !P[p.to].uid), mine = p.from === me;
      return '<div class="bento sky" style="padding:16px"><div class="row">' + av(gid, p.from, 40) + '<div class="grow"><b>' + esc(pname(gid, p.from)) + ' paid ' + esc(pname(gid, p.to)) + '</b><div class="small num" style="opacity:.8">' + rs(p.amount) + '</div></div></div>' +
        (canConfirm ? '<div class="bubble" style="margin-top:14px;font-size:14.5px">' + (p.to === me ? esc(pname(gid, p.from)) + ' says they paid you ' + rs(p.amount) + '. Did it land?' : esc(P[p.to].name) + ' has no account yet. Confirm for them?') + '</div><div class="row" style="margin-top:16px;gap:8px"><button class="btn sm grow" data-a="confirmPay" data-id="' + p.id + '">Yes, got it</button><button class="btn sm glass grow" data-a="rejectPay" data-id="' + p.id + '">Not yet</button></div>'
          : mine ? '<div class="small" style="margin-top:10px">Waiting for ' + esc(pname(gid, p.to)) + ' to confirm.</div><button class="btn xs glass" style="margin-top:10px" data-a="cancelPay" data-id="' + p.id + '">Cancel payment</button>'
          : '<div class="small" style="margin-top:10px">Waiting for ' + esc(pname(gid, p.to)) + ' to confirm.</div>') + '</div>';
    }).join('') + '</div>';
  }
  h += '<div class="label" style="margin:20px 0 10px">Balances</div><div class="card" style="padding:14px 16px;display:grid;gap:14px">' + ppl.map(function(m){
    var v = bal[m] || 0, w = Math.round(Math.abs(v) / max * 50);
    return '<div><div class="row">' + av(gid, m, 32) + '<b class="grow ell">' + esc(pname(gid, m)) + (P[m].uid ? '' : ' <span class="small muted" style="font-weight:600">(no account)</span>') + '</b>' + (v === 0 ? '<span class="muted num" style="font-weight:700">Settled</span>' : '<b class="num ' + (v > 0 ? 'pos' : 'neg') + '">' + signed(v) + '</b>') + '</div>' +
      (v ? '<div class="bar" style="margin-top:8px"><i class="' + (v > 0 ? 'p' : 'n') + '" style="width:' + w + '%"></i></div>' : '') + '</div>';
  }).join('') + '</div>';
  if (sug.length){
    h += '<div class="label" style="margin:20px 0 10px">Suggested payments</div><div style="display:grid;gap:12px">' + sug.map(function(s){
      var has = pend.some(function(p){ return p.from === s.from && p.to === s.to; });
      var btn = '';
      if (has) btn = '<div class="small muted" style="margin-top:8px">Payment recorded, waiting for confirmation.</div>';
      else if (s.from === me) btn = '<button class="btn sm block" style="margin-top:12px" data-a="record" data-from="' + s.from + '" data-to="' + s.to + '" data-amt="' + s.amount + '">I paid ' + esc(pname(gid, s.to)) + '</button>';
      else if (s.to === me) btn = '<div class="row" style="margin-top:12px;gap:8px"><button class="btn sm grow" data-a="received" data-from="' + s.from + '" data-to="' + s.to + '" data-amt="' + s.amount + '">Mark as received</button><button class="btn sm pink" data-a="nudge" data-from="' + s.from + '" data-to="' + s.to + '">Nudge</button></div>';
      else if (owner && !P[s.from].uid && !P[s.to].uid) btn = '<button class="btn sm ghost block" style="margin-top:12px" data-a="received" data-from="' + s.from + '" data-to="' + s.to + '" data-amt="' + s.amount + '">Record as owner</button>';
      return '<div class="card" style="padding:14px 16px"><div class="row"><div class="stack">' + av(gid, s.from, 30) + av(gid, s.to, 30) + '</div><div class="grow"><b>' + esc(pname(gid, s.from)) + ' → ' + esc(pname(gid, s.to)) + '</b></div><b class="num">' + rs(s.amount) + '</b></div>' + btn + '</div>';
    }).join('') + '</div>';
  }
  return h;
}

function activityTab(gid){
  var a = S.activity[gid] || {}, items = Object.keys(a).map(function(k){ return a[k]; }).sort(function(x, y){ return (y.ts || 0) - (x.ts || 0); }).slice(0, 60);
  if (!items.length) return '<div class="empty"><b>Nothing yet</b>Activity shows up here.</div>';

  backdrop:function(el, e){ if (e.target === el){ S.sheet = null; render(true); } },
  seed:async function(){ if (!needWrite()) return; var gid = await seedLunch(); S.gid = gid; S.tab = 'expenses'; go('group'); toast('Lunch example loaded'); },
  openGroup:function(el){ S.gid = el.dataset.id; S.tab = 'expenses'; go('group'); },
  back:function(){ if (S.screen === 'guest') { go('group'); } else if (S.screen === 'group' && !myPid(S.gid)) go('groups'); else if (S.screen === 'group' || S.screen === 'newgroup') { S.gid = S.screen === 'group' ? null : S.gid; go('groups'); } else go('group'); },
  tab:function(el){ S.tab = el.dataset.t; render(true); },

  ngIcon:function(el){ S.ng.icon = +el.dataset.i; $('#ngIcons').innerHTML = ngIcons(); },

  claim:async function(el){ if (!needWrite()) return; var id = el.dataset.id, gid = S.gid; await gcol(gid, 'people').doc(id).update({uid:S.uid}); await gcol(gid, 'activity').add({who:id, text:'joined', ts:Date.now()}); toast('You’re in!'); },
  claimNew:async function(){ if (!needWrite()) return; var gid = S.gid, ref = await gcol(gid, 'people').add({name:S.profile.name, pig:S.profile.pig, uid:S.uid, ts:Date.now()}); await gcol(gid, 'activity').add({who:ref.id, text:'joined', ts:Date.now()}); toast('You’re in!'); },
  actAs:function(el){ S.actAs[S.gid] = el.dataset.id; ls.set('divvy-actas', JSON.stringify(S.actAs)); S.sheet = null; render(true); toast('Now testing as ' + S.people[S.gid][el.dataset.id].name); },

  add:function(){ S.draft = newDraft(S.gid); go('add'); },
  cancelAdd:function(){ var d = S.draft; if (d && (d.title || d.amount) && !d.editId && !S.confirmCancel){ S.confirmCancel = true; toast('Tap Cancel again to discard', null); return; } S.confirmCancel = false; S.draft = null; go('group'); },
  exp:function(el){ S.sheet = {type:'exp', id:el.dataset.id}; render(true); },
  editExp:function(el){
    var gid = S.gid, e = S.expenses[gid][el.dataset.id], d = newDraft(gid);
    d.editId = el.dataset.id; d.title = e.title; d.amount = String(e.amount); d.payAmt = {}; d.shared = {}; d.payTouched = true;
    Object.keys(e.payers).forEach(function(m){ d.payAmt[m] = String(e.payers[m]); });
    Object.keys(e.shares).forEach(function(m){ d.shared[m] = true; });
    d.mode = e.mode || 'exact'; d.pct = Object.assign({}, e.pct); d.exact = Object.assign({}, e.exact);
    if (!Object.keys(d.exact).length) Object.keys(e.shares).forEach(function(m){ d.exact[m] = String(e.shares[m]); });
    S.draft = d; go('add');
  },
  delExp:async function(el){
    if (!needWrite()) return;
    if (!S.sheet.confirm){ S.sheet.confirm = true; render(true); return; }
    var gid = S.gid, id = el.dataset.id, e = S.expenses[gid][id];
    await gcol(gid, 'expenses').doc(id).update({deleted:true}); await log(gid, 'deleted ' + e.title + ' · ' + rs(e.amount));
    S.sheet = null; render(true);
    toast('Expense deleted', 'Undo', async function(){ await gcol(gid, 'expenses').doc(id).update({deleted:false}); await log(gid, 'restored ' + e.title); });
  },
  sOn:function(el){ var d = S.draft, m = el.dataset.id; d.shared[m] = !d.shared[m]; $('#mergeBlock').innerHTML = mergeRows(); refresh(); },
  mode:function(el){ S.draft.mode = el.dataset.m; $('#modeSeg').innerHTML = modeSeg(); $('#mergeBlock').innerHTML = mergeRows(); refresh(); },
  fill:function(){
    var d = S.draft, ids = activePeople(S.gid), v = validateDraft(d, ids); if (!v.ids.length) return;
    if (d.mode === 'pct'){ var base = Math.floor(1000 / v.ids.length) / 10; v.ids.forEach(function(m){ d.pct[m] = String(base); }); var last = v.ids[v.ids.length - 1]; d.pct[last] = String(Math.round((100 - base * (v.ids.length - 1)) * 10) / 10); }
    else { if (!v.total){ toast('Enter the total first'); return; } var sh = splitEqual(v.total, v.ids, v.payers); v.ids.forEach(function(m){ d.exact[m] = String(sh[m]); }); }
    $('#mergeBlock').innerHTML = mergeRows(); refresh();
  },
  save:async function(){
    if (!needWrite()) return;
    var gid = S.gid, d = S.draft, v = validateDraft(d, activePeople(gid)); if (!v.ok) return;
    $('#saveBtn').disabled = true;
    var data = {title:d.title.trim(), amount:v.total, payers:v.payers, shares:v.shares, mode:d.mode, pct:Object.assign({}, d.pct), exact:Object.assign({}, d.exact)};
    if (d.editId){
      var cur = S.expenses[gid][d.editId], old = cur.amount;
      await gcol(gid, 'expenses').doc(d.editId).set(Object.assign({}, cur, data));
      await log(gid, old !== v.total ? 'changed ' + data.title + ' from ' + rs(old) + ' to ' + rs(v.total) : 'edited ' + data.title); toast('Changes saved');
    } else {
      await gcol(gid, 'expenses').add(Object.assign({}, data, {by:myPid(gid), byUid:S.uid, date:fmtDay(Date.now()), ts:Date.now(), deleted:false}));
      await log(gid, 'added ' + data.title + ' · ' + rs(v.total)); toast('Expense added. Everyone sees it now.');
    }
    S.draft = null; S.tab = 'expenses'; go('group');
  },
  share:function(){ S.sheet = {type:'share'}; render(true); },
  gset:function(){ S.sheet = {type:'gset'}; render(true); },
  copyText:function(el){
    var g = S.groups[S.gid], w = el.dataset.w, t = w === 'join' ? 'https://divvy.app/j/' + g.joinCode : w === 'view' ? 'https://divvy.app/v/' + g.token : statusText(S.gid);
    try { navigator.clipboard.writeText(t).then(function(){ toast(w === 'status' ? 'Status copied. Paste it in WhatsApp.' : 'Link copied'); }, function(){ toast(w === 'status' ? 'Copy failed. Select the text manually.' : t); }); } catch(e) { toast(t); }
  },
  regen:async function(){ if (!needWrite()) return; await col('groups').doc(S.gid).update({token:rcode()}); await log(S.gid, 'turned off the old view link'); toast('New view link. The old one stops working.'); },
  guest:function(){ go('guest'); },
  addPerson:async function(){
    if (!needWrite()) return; var i = $('#gPerson'), v = i.value.trim(); if (!v) return;
    await gcol(S.gid, 'people').add({name:v, pig:nextPig(S.gid), uid:null, ts:Date.now()}); await log(S.gid, 'added ' + v); i.value = ''; toast(v + ' added');
  },
  renameGroup:async function(){ if (!needWrite()) return; var v = $('#gName').value.trim(); if (!v) return; var old = S.groups[S.gid].name; await col('groups').doc(S.gid).update({name:v}); await log(S.gid, 'renamed the group to ' + v); toast('Renamed'); },
  removePerson:async function(el){
    if (!needWrite()) return; var gid = S.gid, id = el.dataset.id, nm = S.people[gid][id].name;
    var used = Object.keys(S.expenses[gid] || {}).some(function(k){ var e = S.expenses[gid][k]; return e.payers[id] !== undefined || e.shares[id] !== undefined; });
    if (used) await gcol(gid, 'people').doc(id).update({removed:true}); else await gcol(gid, 'people').doc(id).delete();
    await log(gid, 'removed ' + nm); toast(nm + ' removed');
  },
  deleteGroup:async function(){
    if (!S.sheet.confirmDel){ S.sheet.confirmDel = true; render(true); return; }
    if (!needWrite()) return; var gid = S.gid; S.sheet = null; S.gid = null; go('groups'); await deleteGroupFull(gid); toast('Group deleted');
  },
  nudge:async function(el){
    if (!needWrite()) return; var gid = S.gid, g = S.groups[gid], key = el.dataset.from + '_' + el.dataset.to, last = (g.nudges || {})[key] || 0;
    if (Date.now() - last < 86400000){ toast('You nudged ' + S.people[gid][el.dataset.from].name + ' recently. Try again tomorrow.'); return; }
    var upd = {nudges:{}}; upd.nudges[key] = Date.now(); await col('groups').doc(gid).update(upd);
    await log(gid, 'nudged ' + S.people[gid][el.dataset.from].name + ' about ' + rs((suggest(balOf(gid)).filter(function(s){ return s.from === el.dataset.from && s.to === el.dataset.to; })[0] || {amount:0}).amount));
    toast('Nudge sent. Push notifications arrive in the real app.');
  },
  record:function(el){ S.sheet = {type:'pay', from:el.dataset.from, to:el.dataset.to, max:+el.dataset.amt, amount:el.dataset.amt}; render(true); },
  sendPay:async function(){
    if (!needWrite()) return; var gid = S.gid, s = S.sheet, amt = parseInt(s.amount) || 0; if (!(amt > 0 && amt <= s.max)) return;
    await gcol(gid, 'payments').add({from:s.from, to:s.to, amount:amt, status:'pending', by:myPid(gid), ts:Date.now()});
    await log(gid, 'paid ' + S.people[gid][s.to].name + ' ' + rs(amt) + ' (waiting for confirmation)'); S.sheet = null; render(true); toast('Sent. ' + pname(gid, s.to) + ' needs to confirm.');
  },
  received:async function(el){
    if (!needWrite()) return; var gid = S.gid, amt = +el.dataset.amt;
    await gcol(gid, 'payments').add({from:el.dataset.from, to:el.dataset.to, amount:amt, status:'confirmed', by:myPid(gid), ts:Date.now()});
    await log(gid, 'recorded ' + rs(amt) + ' received from ' + S.people[gid][el.dataset.from].name); toast('Recorded. Balances updated.');
  },
  confirmPay:async function(el){
    if (!needWrite()) return; var gid = S.gid, p = S.payments[gid][el.dataset.id];
    await gcol(gid, 'payments').doc(el.dataset.id).update({status:'confirmed'});
    await log(gid, p.to === myPid(gid) ? 'confirmed ' + S.people[gid][p.from].name + '’s payment of ' + rs(p.amount) : 'confirmed ' + S.people[gid][p.from].name + '’s payment for ' + S.people[gid][p.to].name); toast('Confirmed. Balances updated.');
  },
  rejectPay:async function(el){
    if (!needWrite()) return; var gid = S.gid, p = S.payments[gid][el.dataset.id];
    await gcol(gid, 'payments').doc(el.dataset.id).delete(); await log(gid, 'marked ' + S.people[gid][p.from].name + '’s payment of ' + rs(p.amount) + ' as not received'); toast('Payment removed');
  },
  cancelPay:async function(el){
    if (!needWrite()) return; var gid = S.gid, p = S.payments[gid][el.dataset.id];
    await gcol(gid, 'payments').doc(el.dataset.id).delete(); await log(gid, 'cancelled a payment of ' + rs(p.amount)); toast('Payment cancelled');
  }
};
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]'); if (!el || !$('#phone').contains(el)) return;
  var f = A[el.dataset.a]; if (!f) return;
  if (el.dataset.a !== 'cancelAdd') S.confirmCancel = false;
  try { var r = f(el, e); if (r && r.catch) r.catch(function(err){ console.warn(err); toast('Something went wrong. Try again.'); }); } catch(err){ console.warn(err); toast('Something went wrong. Try again.'); }
});
document.addEventListener('input', function(e){
  var el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  var d = S.draft, id = el.dataset.id;
  if (k === 'frname'){ S.fr.name = el.value; $('#frGo').disabled = !el.value.trim(); return; }
  if (k === 'ngname'){ S.ng.name = el.value; $('#ngCreate').disabled = !el.value.trim(); return; }
  if (k === 'ngperson' || k === 'gperson' || k === 'gname' || k === 'pname') return;
  if (k === 'payamount'){ var v0 = el.value.replace(/\D/g, ''); if (v0 !== el.value) el.value = v0; S.sheet.amount = v0; var a = parseInt(v0) || 0; $('#paySend').disabled = !(a > 0 && a <= S.sheet.max); return; }
  if (k === 'title'){ d.title = el.value; refresh(); return; }
  if (k === 'pct'){ var v1 = el.value.replace(/[^0-9.]/g, ''); if (v1 !== el.value) el.value = v1; d.pct[id] = v1; refresh(); return; }
  var v = el.value.replace(/\D/g, ''); if (v !== el.value) el.value = v;
  if (k === 'amount'){
    d.amount = v;
    if (!d.payTouched && !d.editId){ var me = myPid(S.gid); d.payAmt = {}; d.payAmt[me] = v; var pe = $('#paid-' + me); if (pe) pe.value = v; ids2(function(m){ if (m !== me){ var o = $('#paid-' + m); if (o) o.value = ''; } }); }
  } else if (k === 'payAmt'){ d.payAmt[id] = v; d.payTouched = true; } else if (k === 'exact') d.exact[id] = v;
  refresh();
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  if (e.target.id === 'ngPerson'){ e.preventDefault(); A.ngAdd(); }
  if (e.target.id === 'gPerson'){ e.preventDefault(); A.addPerson(); }
});

function ids2(f){ activePeople(S.gid).forEach(f); }

/* ---------- start ---------- */
async function init(){
  var th = ls.get('divvy-theme'); if (th === 'light' || th === 'dark'){ S.theme = th; document.documentElement.setAttribute('data-theme', th); }
  try { S.actAs = JSON.parse(ls.get('divvy-actas') || '{}'); } catch(e) { S.actAs = {}; }
  var dbn = null, usr = null;
  try { if (window.claude && window.claude.use){ dbn = await window.claude.use('db'); usr = await window.claude.use('user'); } } catch(e) { console.warn('capabilities unavailable', e); }
  if (dbn){ DB = dbn; MODE = 'live'; } else { DB = makeLocalDb(); MODE = 'local'; }
  var uid = null; try { uid = usr ? await usr.id() : null; } catch(e) {}
  if (!uid){ uid = ls.get('divvy-local-uid'); if (!uid){ uid = 'local-' + rcode(); ls.set('divvy-local-uid', uid); } }
  S.uid = uid;
  try { if (usr){ var cw = await usr.can('data.write'); CAN_WRITE = cw !== false; } } catch(e) {}
  var ready = function(){ if (S.seen.groups && S.seen.profiles && !S.ready){ S.ready = true; S.profile = S.profiles[S.uid] || null; S.screen = S.profile ? 'groups' : 'welcome'; render(true); } };
  col('profiles').onSnapshot(function(snap){ S.profiles = toMap(snap); if (S.profiles[S.uid]) S.profile = S.profiles[S.uid]; S.seen.profiles = true; ready(); schedule(); }, function(e){ console.warn(e); S.seen.profiles = true; ready(); });
  col('groups').onSnapshot(function(snap){
    var next = toMap(snap), prev = S.groups; S.groups = next;
    Object.keys(next).forEach(function(id){ if (!prev[id] && !unsubs[id + 'people']) subscribeGroup(id); });
    Object.keys(prev).forEach(function(id){ if (!next[id]){ unsubscribeGroup(id); if (S.gid === id){ S.gid = null; S.sheet = null; if (S.screen === 'group' || S.screen === 'guest' || S.screen === 'add') S.screen = 'groups'; } } });
    S.seen.groups = true; ready(); schedule();
  }, function(e){ console.warn(e); S.seen.groups = true; ready(); });
  render(true);
}
window.__divvy = {S:S, A:A, engine:{splitEqual:splitEqual, splitPercent:splitPercent, validateDraft:validateDraft, balancesOf:balancesOf, suggest:suggest}};
init();
